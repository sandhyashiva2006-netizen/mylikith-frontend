<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>


<!-- =====================================================
     BASIC SEO
===================================================== -->

<title>
    MyLikith Original
</title>


<meta
    id="metaDescription"
    name="description"
    content="Watch exclusive MyLikith Originals."
>


<meta
    id="metaKeywords"
    name="keywords"
    content="MyLikith Originals, Telugu Originals, original stories, web series"
>


<meta
    name="robots"
    content="index, follow, max-image-preview:large"
>


<meta
    name="author"
    content="MyLikith"
>


<link
    id="canonicalUrl"
    rel="canonical"
    href="https://mylikith.in/original"
>


<!-- =====================================================
     OPEN GRAPH
===================================================== -->

<meta
    id="ogTitle"
    property="og:title"
    content="MyLikith Original"
>


<meta
    id="ogDescription"
    property="og:description"
    content="Watch exclusive MyLikith Originals."
>


<meta
    id="ogImage"
    property="og:image"
    content="https://mylikith.in/assets/images/og-image.jpg"
>


<meta
    id="ogUrl"
    property="og:url"
    content="https://mylikith.in/original"
>


<meta
    property="og:type"
    content="website"
>


<meta
    property="og:site_name"
    content="MyLikith"
>


<meta
    property="og:locale"
    content="en_IN"
>


<!-- =====================================================
     TWITTER / X
===================================================== -->

<meta
    name="twitter:card"
    content="summary_large_image"
>


<meta
    id="twitterTitle"
    name="twitter:title"
    content="MyLikith Original"
>


<meta
    id="twitterDescription"
    name="twitter:description"
    content="Watch exclusive MyLikith Originals."
>


<meta
    id="twitterImage"
    name="twitter:image"
    content="https://mylikith.in/assets/images/og-image.jpg"
>


<!-- =====================================================
     STYLES
===================================================== -->

<link
    rel="stylesheet"
    href="css/style.css"
>

<link
    rel="stylesheet"
    href="css/common.css"
>

<link
    rel="stylesheet"
    href="css/home.css"
>

<link
    rel="stylesheet"
    href="css/original.css"
>

<link
    rel="stylesheet"
    href="css/responsive.css"
>

</head>

<body>

<nav
    id="navbar"
    class="navbar">
</nav>


<main class="original-page">


<section class="original-hero">

    <div class="original-hero-background"></div>

    <div class="original-hero-inner">


        <div class="original-cover">

            <img
                id="originalCover"
                src="assets/images/default-cover.png"
                alt="Original Cover"
            >

        </div>


        <div class="original-info">

            <span class="original-label">
                ✦ MYLIKITH ORIGINAL
            </span>


            <h1 id="originalTitle">
                Loading...
            </h1>


            <div class="original-badges">

                <span id="originalCategory">
                    —
                </span>

                <span id="originalLanguage">
                    —
                </span>

                <span id="originalStatus">
                    —
                </span>

            </div>


            <p
                id="originalDescription"
                class="original-description"
            >
                Loading...
            </p>


            <div class="original-stats">

                <div>
                    <strong id="originalViews">
                        0
                    </strong>

                    <span>
                        Views
                    </span>
                </div>


                <div>
                    <strong id="originalLikes">
                        0
                    </strong>

                    <span>
                        Likes
                    </span>
                </div>


                <div>
                    <strong id="originalRating">
                        0
                    </strong>

                    <span>
                        Rating
                    </span>
                </div>

            </div>


<div class="original-actions">

    <button
        id="startOriginalBtn"
        class="start-btn"
    >
        ▶ Start Watching
    </button>

    <button
        id="originalLikeBtn"
        class="writer-btn"
        type="button"
    >
        ♡ Like
    </button>

    <button
        id="shareOriginalBtn"
        class="writer-btn"
        type="button"
    >
        🔗 Share
    </button>

</div>

<div
    id="originalRatingBox"
    class="original-rating-box"
>

    <span class="original-rating-label">
        Rate this Original
    </span>

    <div
        id="originalRatingStars"
        class="original-rating-stars"
    >

        <button
            type="button"
            data-rating="1"
            aria-label="1 star"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="2"
            aria-label="2 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="3"
            aria-label="3 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="4"
            aria-label="4 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="5"
            aria-label="5 stars"
        >
            ★
        </button>

    </div>

    <span
        id="originalUserRating"
        class="original-user-rating"
    >
        Not rated
    </span>

</div>

        </div>

    </div>

</section>


<section class="original-chapters-section">

    <div class="original-section-heading">

        <span>
            THE STORY
        </span>

        <h2>
            Chapters
        </h2>

        <p id="chapterCount">
            Loading chapters...
        </p>

    </div>


    <div
        id="originalChapters"
        class="original-chapters-list"
    >

        <div class="original-loading">
            Loading chapters...
        </div>

    </div>

</section>

<section class="original-comments-section">

    <div class="original-section-heading">

        <span>
            COMMUNITY
        </span>

        <h2>
            Comments
        </h2>

        <p id="originalCommentCount">
            0 Comments
        </p>

    </div>


    <div
        id="originalCommentForm"
        class="original-comment-form"
    >

        <textarea
            id="originalCommentInput"
            class="original-comment-input"
            maxlength="1000"
            placeholder="Share your thoughts about this Original..."
        ></textarea>


        <div class="original-comment-form-footer">

            <span
                id="originalCommentCharacters"
                class="original-comment-characters"
            >
                0 / 1000
            </span>


            <button
                id="originalCommentSubmit"
                class="start-btn"
                type="button"
            >
                Post Comment
            </button>

        </div>

    </div>


    <div
        id="originalComments"
        class="original-comments-list"
    >

        <div class="original-loading">
            Loading comments...
        </div>

    </div>

</section>

</main>


<div id="footer"></div>


<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/original.js"></script>

</body>

</html>
