<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MyLikith Original</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/original.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
    id="navbar"
    class="navbar">
</nav>


<main class="original-page">


<section class="original-hero">

    <div class="original-hero-background"></div>

    <div class="original-hero-inner">


        <div class="original-cover">

            <img
                id="originalCover"
                src="assets/images/default-cover.png"
                alt="Original Cover"
            >

        </div>


        <div class="original-info">

            <span class="original-label">
                ✦ MYLIKITH ORIGINAL
            </span>


            <h1 id="originalTitle">
                Loading...
            </h1>


            <div class="original-badges">

                <span id="originalCategory">
                    —
                </span>

                <span id="originalLanguage">
                    —
                </span>

                <span id="originalStatus">
                    —
                </span>

            </div>


            <p
                id="originalDescription"
                class="original-description"
            >
                Loading...
            </p>


            <div class="original-stats">

                <div>
                    <strong id="originalViews">
                        0
                    </strong>

                    <span>
                        Views
                    </span>
                </div>


                <div>
                    <strong id="originalLikes">
                        0
                    </strong>

                    <span>
                        Likes
                    </span>
                </div>


                <div>
                    <strong id="originalRating">
                        0
                    </strong>

                    <span>
                        Rating
                    </span>
                </div>

            </div>


<div class="original-actions">

    <button
        id="startOriginalBtn"
        class="start-btn"
    >
        ▶ Start Watching
    </button>

    <button
        id="originalLikeBtn"
        class="writer-btn"
        type="button"
    >
        ♡ Like
    </button>

    <button
        id="shareOriginalBtn"
        class="writer-btn"
        type="button"
    >
        🔗 Share
    </button>

</div>

<div
    id="originalRatingBox"
    class="original-rating-box"
>

    <span class="original-rating-label">
        Rate this Original
    </span>

    <div
        id="originalRatingStars"
        class="original-rating-stars"
    >

        <button
            type="button"
            data-rating="1"
            aria-label="1 star"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="2"
            aria-label="2 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="3"
            aria-label="3 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="4"
            aria-label="4 stars"
        >
            ★
        </button>

        <button
            type="button"
            data-rating="5"
            aria-label="5 stars"
        >
            ★
        </button>

    </div>

    <span
        id="originalUserRating"
        class="original-user-rating"
    >
        Not rated
    </span>

</div>

        </div>

    </div>

</section>


<section class="original-chapters-section">

    <div class="original-section-heading">

        <span>
            THE STORY
        </span>

        <h2>
            Chapters
        </h2>

        <p id="chapterCount">
            Loading chapters...
        </p>

    </div>


    <div
        id="originalChapters"
        class="original-chapters-list"
    >

        <div class="original-loading">
            Loading chapters...
        </div>

    </div>

</section>


</main>


<div id="footer"></div>


<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/original.js"></script>

</body>

</html>
