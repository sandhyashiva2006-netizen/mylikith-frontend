<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet | MyLikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/wallet.css">

</head>

<body>

<nav
id="navbar"
class="navbar">
</nav>

<div class="dashboard">

<div class="wallet-container">

    <h1>💰 My Wallet</h1>

    <div class="wallet-card">

        <div class="wallet-box">

            <h2>Wallet Balance</h2>

            <h3 id="walletBalance">₹0</h3>

        </div>

        <div class="wallet-box">

            <h2>Coins</h2>

            <h3 id="walletCoins">0</h3>

        </div>

    </div>

   <div class="wallet-actions">

    <button id="addMoneyBtn">
        + Add Money
    </button>

    <button
        onclick="location.href='coin-store.html'">
        🪙 Buy Coins
    </button>

    <button disabled>
        Withdraw
    </button>

</div>

    <div class="wallet-summary">

        <div class="summary-box">

            <span>Credits</span>

            <strong id="credits">0</strong>

        </div>

        <div class="summary-box">

            <span>Debits</span>

            <strong id="debits">0</strong>

        </div>

        <div class="summary-box">

            <span>Transactions</span>

            <strong id="transactions">0</strong>

        </div>

    </div>

    <div class="transaction-section">

        <h2>Recent Transactions</h2>

        <div id="transactionList">

            Loading...

        </div>

    </div>

</div>

</div>

<div id="footer"></div>

<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/wallet.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
