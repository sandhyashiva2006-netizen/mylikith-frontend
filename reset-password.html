<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Reset Password</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

<style>

body{

background:#020b24;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

font-family:sans-serif;

color:white;

}

.card{

width:400px;

background:#08142f;

padding:30px;

border-radius:20px;

}

input{

width:100%;

padding:14px;

margin:12px 0;

border:none;

border-radius:10px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#7c3aed;

color:white;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<h2>

Create New Password

</h2>

<input

id="password"

type="password"

placeholder="New Password"

>

<button

onclick="resetPassword()"

>

Update Password

</button>

</div>

<script src="js/auth.js"></script>

</body>

</html>
