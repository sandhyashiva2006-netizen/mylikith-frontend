<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


  
<title>Novel Details</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/novel.css">
<link rel="stylesheet" href="css/responsive.css">

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="novel-hero">

<div class="hero-overlay"></div>

<div class="novel-cover">

<img
id="novelCover"
src="assets/images/default-cover.png"
alt="Novel Cover">

</div>

<div class="novel-info">

<h1 id="novelTitle">

Loading...

</h1>

<div class="badges">

<span id="novelCategory">

Loading...

</span>

<span id="novelLanguage">

Loading...

</span>

<span id="novelStatus">

Loading...

</span>

</div>

<div class="description-card">

<h3>

📖 About this Novel

</h3>

<p id="novelDescription">

Loading...

</p>

<button
id="toggleDescription"
class="text-btn">

Show More

</button>

</div>

<div class="novel-stats">

<div class="stat-card">

<span id="novelReads">

0

</span>

<p>

👁 Reads

</p>

</div>

<div class="stat-card">

<span id="novelFollowers">

0

</span>

<p>

❤️ Followers

</p>

</div>

<div class="stat-card">

<h3 id="novelRating">

0

</h3>

<p>

⭐ Rating

</p>

</div>

</div>

<div class="novel-actions glass-actions">

<button
class="start-btn"
id="startReadingBtn">

📖 Start Reading

</button>

<button
class="library-btn"
id="libraryBtn">

📚 Add to Library

</button>

<button
class="writer-btn"
id="followBtn">

❤️ Follow Author

</button>

<button
class="share-btn"
id="shareBtn">

🔗 Share

</button>

<button
class="report-btn"
id="reportBtn">

🚩 Report

</button>

</div>

</div>

</section>

<section class="chapters-section">

<div class="section-header">

<h2>

📚 Chapters

</h2>

<span id="chapterCount">

0 Chapters

</span>

</div>

<div
id="chaptersList"
class="chapters-list">

</div>

</section>

<section class="author-section">

<h2>

✍ Author

</h2>

<div class="author-card glass-card">

<img
id="authorAvatar"
class="author-avatar"
src="assets/images/default-avatar.png"
alt="Author">

<div class="author-info">

<a id="authorLink">

<span id="authorName">

</span>

</a>

<p id="authorBio">

Writer

</p>

<div class="author-stats">

<div>

<strong id="authorFollowers">

0

</strong>

<span>

Followers

</span>

</div>

<div>

<strong id="authorNovels">

0

</strong>

<span>

Novels

</span>

</div>

<div>

<strong id="authorRating">

0

</strong>

<span>

Rating

</span>

</div>

</div>

</div>

</div>

</section>

<section class="reviews-section">

<div class="section-header">

<h2>

⭐ Ratings & Reviews

</h2>

<span>

Share your experience

</span>

</div>

<div class="review-form">

<div class="review-top">

<div class="review-field">

<label>

Rating

</label>

<select
id="ratingSelect"
class="input">

<option value="5">

⭐⭐⭐⭐⭐ Excellent

</option>

<option value="4">

⭐⭐⭐⭐ Very Good

</option>

<option value="3">

⭐⭐⭐ Good

</option>

<option value="2">

⭐⭐ Fair

</option>

<option value="1">

⭐ Poor

</option>

</select>

</div>

</div>

<div class="review-field">

<label>

Your Review

</label>

<textarea
id="reviewText"
class="review-textarea"
placeholder="Share your thoughts about this novel...">

</textarea>

</div>

<div class="review-actions">

<button
id="submitReviewBtn"
class="chapter-btn">

⭐ Submit Review

</button>

</div>

</div>

<div id="reviewsList">

Loading reviews...

</div>

</section>

<section class="related-section">

<div class="section-header">

<h2>

📚 You May Also Like

</h2>

</div>

<div
id="similarNovels"
class="related-grid">

</div>

</section>


<div class="mobile-read">

<button
id="mobileReadBtn">

📖 Read Now

</button>

</div>

<div id="footer"></div>

<script src="js/novel.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
