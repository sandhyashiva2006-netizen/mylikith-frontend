<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Novel Details</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/novel.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="novel-hero">

<div class="novel-cover"></div>

<div class="novel-info">

<h1 id="novelTitle">Loading...</h1>

<div class="badges">

<span id="novelCategory">Loading...</span>
<span id="novelLanguage">Loading...</span>
<span id="novelStatus">Loading...</span>

</div>

<p id="novelDescription">
Loading...
</p>


<div class="novel-stats">

<div>
<span id="novelReads">0</span>
<p>Reads</p>
</div>

<div>
<span id="novelFollowers">0</span>
<p>Followers</p>
</div>

<div>
<h3 id="novelRating">0</h3>
<p>Rating</p>
</div>

</div>

<div class="novel-actions">

<button
class="start-btn"
id="startReadingBtn">
Start Reading
</button>

<button
class="writer-btn"
id="followBtn">

Follow Author

</button>

</div>


</div>

</section>

<section class="chapters-section">

<h2>Chapters</h2>

<div id="chaptersList" class="chapters-list">

</div>

</section>

<section class="reviews-section">

<h2>
⭐ Ratings & Reviews
</h2>

<div class="review-form">

<select id="ratingSelect">

<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>

</select>

<textarea
id="reviewText"
placeholder="Write your review...">
</textarea>

<button
id="submitReviewBtn">

Submit Review

</button>

</div>

<div id="reviewsList">

Loading reviews...

</div>


</section>

<div id="footer"></div>

<script src="js/novel.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
