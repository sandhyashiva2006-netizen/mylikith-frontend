<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyLikith Universe Studio</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/writer-dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
.wu-wrap{max-width:1180px;margin:35px auto;padding:20px;color:var(--text-color,#fff)}.wu-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}.wu-head h1{margin:0}.wu-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.wu-tabs button,.wu-btn{border:1px solid #7552a8;background:#211832;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer}.wu-tabs button.active,.wu-btn.primary{background:#8050bd}.wu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.wu-card,.wu-panel{background:rgba(28,22,42,.94);border:1px solid #49365f;border-radius:15px;padding:18px}.wu-card h3{margin:0 0 8px}.wu-muted{opacity:.72;font-size:13px}.wu-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wu-form label{display:flex;flex-direction:column;gap:6px;font-size:13px}.wu-form input,.wu-form select,.wu-form textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #55436a;background:#171321;color:#fff}.wu-form textarea{min-height:90px;resize:vertical}.wu-form .wide{grid-column:1/-1}.wu-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.wu-list{display:grid;gap:10px;margin-top:15px}.wu-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-radius:9px;background:#191423}.wu-item button{margin-left:6px}.wu-status{font-size:12px;opacity:.7}.wu-msg{margin:12px 0;padding:10px;border-radius:8px;background:#2a2039}.wu-hidden{display:none!important}@media(max-width:650px){.wu-form{grid-template-columns:1fr}.wu-form .wide{grid-column:auto}.wu-wrap{padding:12px}}
.wu-upload-progress{display:block;width:100%;height:12px;margin-top:10px;accent-color:#9560d5}.wu-upload-progress[hidden],#audioUploadPercent[hidden]{display:none}
</style></head><body><nav id="navbar" class="navbar"></nav><main class="wu-wrap"><header class="wu-head"><div><h1>MyLikith Universe Studio</h1><p class="wu-muted">Create and manage Audio novels and MyLikith Originals from one place.</p></div><a class="wu-btn" href="writer-dashboard.html">← Writer Dashboard</a></header><div id="wuMessage" class="wu-msg wu-hidden"></div><div class="wu-tabs"><button class="active" data-tab="audio">🎧 Audio Novels</button><button data-tab="originals">🎬 MyLikith Originals</button></div><section id="audioPanel" class="wu-panel"><div class="wu-head"><h2>Audio projects</h2><button class="wu-btn primary" id="newAudio">＋ New Audio Novel</button></div><div id="audioList" class="wu-grid"></div></section><section id="originalsPanel" class="wu-panel wu-hidden"><div class="wu-head"><h2>Originals series</h2><button class="wu-btn primary" id="newOriginal">＋ New Series</button></div><div id="originalsList" class="wu-grid"></div></section><section id="projectEditor" class="wu-panel wu-hidden" style="margin-top:18px"><h2 id="projectHeading">Create project</h2><form id="projectForm" class="wu-form"><input type="hidden" id="projectId"><input type="hidden" id="projectType"><label>Title<input id="pTitle" required maxlength="180"></label><label>Language<input id="pLanguage" placeholder="Telugu / English / Hindi"></label><label>Category<input id="pCategory"></label><label>Content type<select id="pContentType"><option value="story">Story</option><option value="novel">Novel</option><option value="series">Series</option><option value="podcast">Podcast</option></select></label><label>Status<select id="pStatus"><option value="ongoing">Ongoing</option><option value="completed">Completed</option><option value="hiatus">Hiatus</option></select></label><label class="wide">Cover image<input id="pCoverFile" type="file" accept="image/jpeg,image/png,image/webp"><small id="coverStatus" class="wu-muted">Choose JPG, PNG or WebP (max 5 MB).</small><img id="coverPreview" class="wu-hidden" style="max-width:130px;max-height:180px;object-fit:cover;border-radius:8px"></label><input id="pCover" type="hidden"><label class="wide">Description<textarea id="pDescription"></textarea></label><div class="wide wu-actions"><button class="wu-btn primary" type="submit">Save project</button><button class="wu-btn" type="button" id="cancelProject">Cancel</button></div></form></section><section id="chapterEditor" class="wu-panel wu-hidden" style="margin-top:18px"><div class="wu-head"><div><h2 id="chapterHeading">Chapters / Episodes</h2><p class="wu-muted" id="chapterProjectName"></p></div><button class="wu-btn" id="closeChapters">Close</button></div><form id="chapterForm" class="wu-form"><input type="hidden" id="chapterProjectId"><input type="hidden" id="chapterType"><input type="hidden" id="chapterEditId"><label>Number<input id="cNumber" type="number" min="1" required></label><label>Title<input id="cTitle" required maxlength="180"></label><label id="mediaTypeLabel" class="wu-hidden">Episode format<select id="cMediaType"><option value="video">Video</option><option value="audio">Audio</option><option value="text">Text</option></select></label><label class="wide" id="contentLabel">Episode text<textarea id="cContent" placeholder="Enter the complete text episode here."></textarea></label>
<label class="wide wu-hidden" id="originalVideoUploadLabel">Episode video file<input id="cVideoFile" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov"><small id="videoUploadStatus" class="wu-muted" role="status" aria-live="polite">MP4, WebM or MOV video. Select a file, then save the episode to upload it.</small><progress id="videoUploadProgress" value="0" max="100" class="wu-upload-progress" hidden></progress><small id="videoUploadPercent" class="wu-muted" hidden>0%</small></label>
<label class="wide wu-hidden" id="audioUploadLabel">Chapter MP3<input id="cAudioFile" type="file" accept="audio/mpeg,.mp3"><small id="audioUploadStatus" class="wu-muted" role="status" aria-live="polite">MP3 only, maximum 500 MB. Select a file, then click Save changes to start uploading.</small>
<progress id="audioUploadProgress" value="0" max="100" class="wu-upload-progress" hidden></progress>
<small id="audioUploadPercent" class="wu-muted" hidden>0%</small></label><label><span><input id="cPremium" type="checkbox"> Premium / coin locked</span></label><label>Coins required<input id="cCoins" type="number" min="0" value="0"></label><label><span><input id="cEarly" type="checkbox"> Early access</span></label><label>Schedule publish time<input id="cPublishAt" type="datetime-local"></label><div class="wide wu-actions"><button class="wu-btn primary" type="submit">Add chapter / episode</button></div></form><div id="chapterList" class="wu-list"></div></section></main><script src="js/navbar.js"></script><script src="js/writer-universe-studio.js"></script></body></html>
