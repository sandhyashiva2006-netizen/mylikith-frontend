<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch Episode — MyLikith Originals</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">

    <link
        rel="stylesheet"
        href="css/original-chapter.css"
    >
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
    id="navbar"
    class="navbar">
</nav>


<main class="original-chapter-page">

    <section class="video-section">

        <a
            id="backLink"
            href="javascript:history.back()"
            class="back-link"
        >
            ← Back
        </a>


        <div
            id="playerContainer"
            class="video-player-container"
        >

            <div
                id="playerLoading"
                class="player-state"
            >

                <div class="player-spinner"></div>

                <p>
                    Preparing video...
                </p>

            </div>


            <video
                id="originalVideo"
                class="original-video"
                controls
                playsinline
                preload="metadata"
                hidden
            ></video>


            <div
                id="playerError"
                class="player-state"
                hidden
            >

                <div class="player-error-icon">
                    ⚠️
                </div>

                <h2>
                    Video unavailable
                </h2>

                <p id="playerErrorMessage">
                    Unable to load this episode.
                </p>

                <button
                    id="retryButton"
                    class="retry-button"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        </div>


        <div class="episode-header">

            <div>

                <div
                    id="originalTitle"
                    class="original-title"
                >
                    MyLikith Original
                </div>

                <h1 id="episodeTitle">
                    Loading...
                </h1>

                <div
                    id="episodeMeta"
                    class="episode-meta"
                ></div>

            </div>

        </div>


        <div
            id="premiumNotice"
            class="premium-notice"
            hidden
        >

<div class="premium-icon">
    👑
</div>

<div class="premium-content">

    <h3 id="premiumTitle">
        Premium Episode
    </h3>

    <p id="premiumMessage">
        This episode requires premium access.
    </p>

    <div
        id="premiumActions"
        class="premium-actions"
    >

        <button
            id="loginPremiumBtn"
            class="premium-action-button"
            type="button"
            hidden
        >
            🔐 Login to Watch
        </button>

        <button
            id="unlockPremiumBtn"
            class="premium-action-button"
            type="button"
            hidden
        >
            🪙 Unlock Episode
        </button>

        <button
            id="walletPremiumBtn"
            class="premium-secondary-button"
            type="button"
            hidden
        >
            🪙 Buy Coins
        </button>

    </div>

</div>

        </div>

<div
    id="episodeNavigation"
    class="episode-navigation"
    hidden
>

    <button
        id="previousEpisodeBtn"
        class="episode-nav-button"
        type="button"
    >
        ← Previous Episode
    </button>

    <button
        id="nextEpisodeBtn"
        class="episode-nav-button"
        type="button"
    >
        Next Episode →
    </button>

</div>

    </section>

</main>


<div id="footer"></div>


<script src="js/session.js"></script>

<script src="js/navbar.js"></script>

<script src="js/footer.js"></script>

<script src="js/original-chapter.js"></script>

</body>

</html>
