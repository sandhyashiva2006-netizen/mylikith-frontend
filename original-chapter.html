<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch Episode — MyLikith Originals</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/common.css"
    >

    <link
        rel="stylesheet"
        href="css/original-chapter.css"
    >

</head>

<body>

<nav
    id="navbar"
    class="navbar"
></nav>


<main class="original-chapter-page">

    <section class="video-section">

        <a
            id="backLink"
            href="javascript:history.back()"
            class="back-link"
        >
            ← Back
        </a>


        <div
            id="playerContainer"
            class="video-player-container"
        >

            <div
                id="playerLoading"
                class="player-state"
            >

                <div class="player-spinner"></div>

                <p>
                    Preparing video...
                </p>

            </div>


            <video
                id="originalVideo"
                class="original-video"
                controls
                playsinline
                preload="metadata"
                hidden
            ></video>


            <div
                id="playerError"
                class="player-state"
                hidden
            >

                <div class="player-error-icon">
                    ⚠️
                </div>

                <h2>
                    Video unavailable
                </h2>

                <p id="playerErrorMessage">
                    Unable to load this episode.
                </p>

                <button
                    id="retryButton"
                    class="retry-button"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        </div>


        <div class="episode-header">

            <div>

                <div
                    id="originalTitle"
                    class="original-title"
                >
                    MyLikith Original
                </div>

                <h1 id="episodeTitle">
                    Loading...
                </h1>

                <div
                    id="episodeMeta"
                    class="episode-meta"
                ></div>

            </div>

        </div>


        <div
            id="premiumNotice"
            class="premium-notice"
            hidden
        >

            <div class="premium-icon">
                👑
            </div>

            <div>

                <h3>
                    Premium Episode
                </h3>

                <p id="premiumMessage">
                    This episode requires premium access.
                </p>

            </div>

        </div>

    </section>

</main>


<div id="footer"></div>


<script src="js/session.js"></script>

<script src="js/navbar.js"></script>

<script src="js/footer.js"></script>

<script src="js/original-chapter.js"></script>

</body>

</html>
