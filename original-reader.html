<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MyLikith Originals Reader</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/original-reader.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
    id="navbar"
    class="navbar">
</nav>


<div class="progress-container">

    <div id="progressBar"></div>

</div>


<div
    id="readingProgress"
    class="reading-progress"
>
    0%
</div>


<main class="reader-container original-reader">

    <div class="reader-back-container">

        <button
            id="backToOriginalBtn"
            class="reader-back-btn"
        >
            ← Back to Original
        </button>

    </div>


    <div class="original-reader-label">
        ✦ MYLIKITH ORIGINAL
    </div>


    <h1 id="chapterTitle">
        Loading...
    </h1>


    <div
        id="chapterLockContainer"
    ></div>


    <div
        id="chapterContent"
    >
        Loading...
    </div>


    <div class="chapter-navigation">

        <button
            id="prevChapterBtn"
            class="start-btn"
        >
            ⬅ Previous
        </button>


        <button
            id="nextChapterBtn"
            class="writer-btn"
        >
            Next ➡
        </button>

    </div>

</main>


<div id="footer"></div>


<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/original-reader.js"></script>

</body>

</html>
