<!DOCTYPE html>
<html>

<head>

<title>Create Novel</title>

<link rel="stylesheet"
href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet"
href="css/home.css">

<style>

.container{
max-width:700px;
margin:auto;
padding:100px 20px;
}

input,
textarea,
select{

width:100%;

padding:15px;

margin-bottom:20px;

border:none;

border-radius:10px;
}

button{

padding:15px 30px;

background:#7c3aed;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

</style>

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="container">

<h1>Create Novel</h1>

<input
id="title"
placeholder="Novel Title">

<textarea
id="description"
placeholder="Description"></textarea>

<select id="language">

<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>

</select>

<select id="category">

<option>Fantasy</option>
<option>Romance</option>
<option>Adventure</option>
<option>Drama</option>

</select>

<button onclick="createNovel()">

Create Novel

</button>

</div>

<div class="form-group">

<div id="coverUpload" class="cover-upload">

<input
type="file"
id="cover"
accept="image/*"
hidden>

<img
id="coverPreview"
src="assets/images/default-cover.png"
class="cover-preview">

<div class="cover-overlay">

<div class="cover-icon">

📖

</div>

<h3>

Click to Upload Cover

</h3>

<p>

JPG • PNG • WEBP

<br>

Recommended 600 × 900

</p>

<button
type="button"
class="upload-btn"
onclick="document.getElementById('cover').click()">

Choose Cover

</button>

</div>

</div>

</div>

<div id="footer"></div>

<script src="js/create-novel.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
