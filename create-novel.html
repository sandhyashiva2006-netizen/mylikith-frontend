<!DOCTYPE html>
<html>

<head>

<title>Create Novel</title>

<link rel="stylesheet"
href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet"
href="css/home.css">
<link rel="stylesheet" href="css/responsive.css">

<style>

.container{
max-width:700px;
margin:auto;
padding:100px 20px;
}

input,
textarea,
select{

width:100%;

padding:15px;

margin-bottom:20px;

border:none;

border-radius:10px;
}

button{

padding:15px 30px;

background:#7c3aed;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

}

</style>

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="container">

<h1>Create Novel</h1>

<input
id="title"
placeholder="Novel Title">

<textarea
id="description"
placeholder="Description"></textarea>

<select id="language">

<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>Marathi</option>
<option>Bengali</option>
<option>Gujarati</option>
<option>Punjabi</option>
<option>Odia</option>
<option>Assamese</option>
<option>Urdu</option>
<option>Konkani</option>
<option>Kashmiri</option>
<option>Sanskrit</option>
<option>Manipuri</option>
<option>Bodo</option>
<option>Santali</option>
<option>Dogri</option>
<option>Maithili</option>
<option>Nepali</option>

<option>Japanese</option>
<option>Korean</option>
<option>Chinese</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Italian</option>
<option>Portuguese</option>
<option>Russian</option>
<option>Arabic</option>
<option>Turkish</option>
<option>Thai</option>
<option>Vietnamese</option>
<option>Indonesian</option>
<option>Malay</option>
<option>Filipino</option>

</select>

<label class="form-label">
Categories
<span>(Select up to 5)</span>
</label>

<div id="categoryContainer" class="category-container">

<label><input type="checkbox" value="Fantasy"> Fantasy</label>

<label><input type="checkbox" value="Romance"> Romance</label>

<label><input type="checkbox" value="Adventure"> Adventure</label>

<label><input type="checkbox" value="Action"> Action</label>

<label><input type="checkbox" value="Mystery"> Mystery</label>

<label><input type="checkbox" value="Thriller"> Thriller</label>

<label><input type="checkbox" value="Horror"> Horror</label>

<label><input type="checkbox" value="Drama"> Drama</label>

<label><input type="checkbox" value="Comedy"> Comedy</label>

<label><input type="checkbox" value="Sci-Fi"> Sci-Fi</label>

<label><input type="checkbox" value="Historical"> Historical</label>

<label><input type="checkbox" value="Crime"> Crime</label>

<label><input type="checkbox" value="Detective"> Detective</label>

<label><input type="checkbox" value="Magic"> Magic</label>

<label><input type="checkbox" value="Supernatural"> Supernatural</label>

<label><input type="checkbox" value="Young Adult"> Young Adult</label>

<label><input type="checkbox" value="Psychological"> Psychological</label>

<label><input type="checkbox" value="Children"> Children</label>

</div>

<button onclick="createNovel()">

Create Novel

</button>

</div>

<div class="form-group">

<div id="coverUpload" class="cover-upload">

<input
type="file"
id="cover"
accept="image/*"
hidden>

<img
id="coverPreview"
src="assets/images/default-cover.png"
class="cover-preview">

<div class="cover-overlay">

<div class="cover-icon">

📖

</div>

<h3>

Click to Upload Cover

</h3>

<p>

JPG • PNG • WEBP

<br>

Recommended 600 × 900

</p>

<button
type="button"
class="upload-btn"
onclick="document.getElementById('cover').click()">

Choose Cover

</button>

</div>

</div>

</div>

<div id="footer"></div>

<script src="js/create-novel.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
