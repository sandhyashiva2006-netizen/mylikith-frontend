<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Contest Details - MyLikith</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">

        <div class="logo">

            <h2>MyLikith Admin</h2>

        </div>

    </aside>

    <main class="main-content">

        <div class="page-header">

            <h1 id="contestTitle">
                Contest
            </h1>

            <a
                href="admin-contests.html"
                class="btn-secondary">

                ← Back

            </a>

        </div>

        <div class="stats-grid">

            <div class="stat-card">

                <h3>Language</h3>

                <p id="contestLanguage">-</p>

            </div>

            <div class="stat-card">

                <h3>Prize Pool</h3>

                <p id="contestPrize">₹0</p>

            </div>

            <div class="stat-card">

                <h3>Entries</h3>

                <p id="contestEntries">0</p>

            </div>

            <div class="stat-card">

                <h3>Status</h3>

                <p id="contestStatus">-</p>

            </div>

        </div>

        <div class="table-card">

            <div class="table-header">

                <h2>

                    Contest Entries

                </h2>

            </div>

            <table class="admin-table">

                <thead>

                    <tr>

                        <th>Novel</th>
                        <th>Writer</th>
                        <th>Category</th>
                        <th>Votes</th>
                        <th>Registered</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="entriesTable">

                    <tr>

                        <td
                            colspan="6"
                            class="loading">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

<div class="table-card">

    <div class="table-header">

        <h2>
            Announce Winners
        </h2>

    </div>

    <div class="form-grid">

        <div class="form-group">

            <label>🥇 First Place</label>

            <select id="winner1">

                <option value="">Select Entry</option>

            </select>

        </div>

        <div class="form-group">

            <label>🥈 Second Place</label>

            <select id="winner2">

                <option value="">Select Entry</option>

            </select>

        </div>

        <div class="form-group">

            <label>🥉 Third Place</label>

            <select id="winner3">

                <option value="">Select Entry</option>

            </select>

        </div>

    </div>

    <div style="margin-top:20px">

        <button
            id="announceWinners"
            class="btn-primary">

            Announce Winners

        </button>

    </div>

</div>

    </main>

</div>



<script src="js/admin-auth.js"></script>

<script src="js/admin-contest.js"></script>

</body>

</html>
