<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyLikith Originals</title>

    <meta
        name="description"
        content="Discover exclusive stories produced by MyLikith."
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/originals.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


<!-- NAVBAR -->

<nav
    id="navbar"
    class="navbar">
</nav>


<main class="originals-page">


    <!-- HERO -->

    <section class="originals-hero">

        <div class="originals-hero-glow"></div>

        <div class="originals-hero-content">

            <span class="originals-eyebrow">
                ✦ MYLIKITH UNIVERSE
            </span>

            <h1>
                MyLikith
                <span>Originals</span>
            </h1>

            <p>
                Exclusive stories created for the MyLikith Universe.
                Stories you won't find anywhere else.
            </p>

        </div>

    </section>


    <!-- FEATURED -->

    <section
        id="featuredSection"
        class="originals-section"
    >

        <div class="originals-section-heading">

            <div>

                <span>
                    FEATURED
                </span>

                <h2>
                    Original Stories
                </h2>

                <p>
                    Discover stories created exclusively for MyLikith.
                </p>

            </div>

        </div>


        <div
            id="featuredOriginals"
            class="originals-grid"
        >

            <div class="originals-loading">

                <div class="originals-spinner"></div>

                <p>
                    Loading Originals...
                </p>

            </div>

        </div>

    </section>


    <!-- ALL ORIGINALS -->

    <section class="originals-section">

        <div class="originals-section-heading">

            <div>

                <span>
                    ORIGINALS LIBRARY
                </span>

                <h2>
                    Explore Originals
                </h2>

            </div>


            <div class="originals-filters">

                <input
                    type="search"
                    id="originalSearch"
                    placeholder="Search Originals..."
                    autocomplete="off"
                >

                <select id="languageFilter">

                    <option value="">
                        All Languages
                    </option>

                </select>


                <select id="categoryFilter">

                    <option value="">
                        All Categories
                    </option>

                </select>


                <button
                    type="button"
                    id="clearFilters"
                >
                    Clear
                </button>

            </div>

        </div>


        <div
            id="originalsGrid"
            class="originals-grid"
        >

            <div class="originals-loading">

                <div class="originals-spinner"></div>

                <p>
                    Loading Originals...
                </p>

            </div>

        </div>

    </section>


</main>


<!-- FOOTER -->

<div id="footer"></div>


<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/originals.js"></script>


</body>

</html>
