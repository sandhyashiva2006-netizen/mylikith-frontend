<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply | MyLikith Author Growth Partner</title><style>body{margin:0;background:#100d1b;color:#f5efff;font:15px Arial}.wrap{max-width:680px;margin:40px auto;padding:25px}.panel{background:#1d172b;border:1px solid #493565;border-radius:18px;padding:28px}label{display:block;margin:16px 0 7px;color:#d8c9ed}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #54416e;background:#120e1c;color:white}textarea{min-height:90px}button{margin-top:20px;padding:13px 22px;border:0;border-radius:10px;background:#9b68ed;color:white;font-weight:bold;cursor:pointer}small{color:#bcb0ca;line-height:1.6}#msg{margin-top:15px;color:#d7c1ff}</style></head><body><main class="wrap"><p><a href="partners.html" style="color:#c5a4ff">← Back to programme</a></p><section class="panel"><h1>Partner application</h1><p>Sign in to your existing MyLikith account first. You do not need a separate partner login.</p><form id="apply"><label>Phone number</label><input name="phone" maxlength="30"><label>Primary language / author community</label><select name="language_focus"><option>Telugu</option><option>Hindi</option><option>English</option><option>Kannada</option><option>Other Indian languages</option></select><label>Relevant experience</label><textarea name="experience" maxlength="2000" placeholder="Writing communities, book reviews, social media, outreach, etc."></textarea><label>Why do you want to become a MyLikith Author Growth Partner? *</label><textarea name="motivation" maxlength="3000" required></textarea><label>Social profile links (optional)</label><textarea name="social_links" maxlength="1000" placeholder="Instagram, Facebook, LinkedIn, etc."></textarea><p><label style="display:flex;gap:9px;align-items:flex-start"><input type="checkbox" name="accept_terms" value="yes" required style="width:auto;margin-top:4px"><small>I have read and agree to the <a href="partners-terms.html" style="color:#c5a4ff">programme terms</a> and understand that approval and earnings are not guaranteed.</small></label></p><button type="submit">Submit application</button><div id="msg"></div></form></section></main><script>const API='https://mylikith-backend.onrender.com';document.getElementById('apply').addEventListener('submit',async e=>{e.preventDefault();const token=localStorage.getItem('token');const msg=document.getElementById('msg');if(!token){msg.textContent='Please log in to your MyLikith account, then return to this page.';return;}const data=Object.fromEntries(new FormData(e.target).entries());data.accept_terms=data.accept_terms==='yes';try{const r=await fetch(API+'/api/partners/apply',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});const j=await r.json();msg.textContent=j.message|| (j.success?'Application submitted.':'Unable to submit.');if(j.success)e.target.reset();}catch(_){msg.textContent='Network error. Please try again.';}});</script></body></html>
