<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Forgot Password - MyLikith</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#020b24;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
color:white;
}

.card{
width:400px;
background:#08142f;
padding:30px;
border-radius:20px;
}

input{

width:100%;
padding:14px;
margin:15px 0;
border:none;
border-radius:10px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-size:18px;
cursor:pointer;

}

a{

color:#b794f6;

}

</style>

</head>

<body>

<div class="card">

<h2>Forgot Password</h2>

<p>

Enter your registered email.

</p>

<input

id="email"

placeholder="Email"

>

<button

onclick="forgotPassword()"

>

Send Reset Link

</button>

<br><br>

<a href="login.html">

Back to Login

</a>

</div>

<script src="js/auth.js"></script>

</body>

</html>
