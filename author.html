<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Author Profile - MyLikith</title>

<meta name="description"
content="Discover author profiles, published novels and follow your favourite writers on MyLikith.">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/author.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav id="navbar" class="navbar"></nav>

<section class="author-container">

<div class="author-header">

<div class="author-avatar">

<img
id="authorImage"
src="assets/images/default-avatar.png"
alt="Author">

</div>

<div class="author-details">

<div class="author-badge">

✍️ Verified MyLikith Author

</div>

<h1 id="authorName">

Loading...

</h1>

<p class="author-tagline">

Creating worlds, one chapter at a time.

</p>

<p id="authorBio">

Loading author information...

</p>

<div
id="authorSocialLinks"
class="author-social-links">

</div>

<div class="author-highlights">

<div>

⭐

<span id="authorHeaderRating">

0

</span>

</div>

<div>

❤️

<span id="authorHeaderFollowers">

0

</span>

</div>

<div>

📚

<span id="authorHeaderBooks">

0

</span>

</div>

</div>

<button
id="followAuthorBtn"
class="btn-primary">

❤️ Follow Author

</button>

<button
id="shareAuthorBtn"
class="btn-primary">

📤 Share Author

</button>

<button
id="contactAuthorBtn"
class="btn-primary">

✉️ Contact Author

</button>

</div>

</div>

<div class="author-stats">

<div class="stat-card">

<h2 id="authorNovelCount">0</h2>

<p>📚 Novels</p>

</div>

<div class="stat-card">

<h2 id="authorViews">0</h2>

<p>👀 Views</p>

</div>

<div class="stat-card">

<h2 id="authorRating">0</h2>

<p>⭐ Rating</p>

</div>

<div class="stat-card">

<h2 id="authorFollowers">0</h2>

<p>❤️ Followers</p>

</div>

</div>

<section class="author-books">

<h2>

📚 Published Novels

</h2>

<div
id="authorBooks"
class="novels-grid">

</div>

<div class="stat-card">

<h2 id="authorChapters">0</h2>

<p>📖 Chapters</p>

</div>

<div class="stat-card">

<h2 id="authorLikes">0</h2>

<p>❤️ Likes</p>

</div>

<div class="stat-card">

<h2 id="authorAverageViews">0</h2>

<p>📊 Avg Views</p>

</div>

</section>

</section>

<div id="footer"></div>

<script src="js/navbar.js"></script>
<script src="js/author.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
