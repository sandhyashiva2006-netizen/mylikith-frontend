<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reader - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="progress-container">
<div id="progressBar"></div>
</div>

<div id="readingProgress" class="reading-progress">

0%

</div>

<section class="reader-container">

<h1 id="chapterTitle">
Loading...
</h1>

<div class="reader-toolbar">

<button id="settingsToggle" class="reader-main-btn">

📖 Reader Settings

</button>

<div class="reader-quick-actions">

<button id="bookmarkBtn">🔖 Bookmark</button>

<button id="translateBtn">🌍 Translate</button>

<button id="likeBtn" class="reader-action-btn">

🤍 Like

<span id="likeCount">0</span>

</button>

</div>

</div>

<div id="readerSettings" class="reader-settings">

<button id="decreaseFont">A-</button>

<button id="increaseFont">A+</button>

<button id="themeBtn">🌙 Theme</button>

<button id="premiumThemeBtn">✨ Premium Theme</button>

<select id="fontSelector">

<option value="default">Default</option>

<option value="serif">Classic Serif ⭐</option>

<option value="literata">Literata ⭐</option>

<option value="garamond">Garamond ⭐</option>

</select>

<button id="readAloudBtn">🎧 Listen</button>

<button id="pauseSpeechBtn">⏸ Pause</button>

<button id="stopSpeechBtn">⏹ Stop</button>

<select id="speechRate">

<option value="0.75">0.75x</option>
<option value="1" selected>1x</option>
<option value="1.25">1.25x</option>
<option value="1.5">1.5x</option>
<option value="2">2x</option>

</select>

<button id="fullscreenBtn">⛶ Fullscreen</button>

</div>

<div id="chapterLockContainer"></div>

<div id="chapterCompleted" class="chapter-completed">

<div class="completed-icon">

🎉

</div>

<h2>

Chapter Completed

</h2>

<p>

Hope you enjoyed this chapter.

</p>

<div class="completed-actions">

<button id="completedLikeBtn">

❤️ Like Chapter

</button>

<button id="completedCommentBtn">

💬 Comment

</button>

<button id="completedNextBtn">

➡ Next Chapter

</button>

</div>

</div>

<div class="chapter-navigation">

<button
id="prevChapterBtn"
class="start-btn">

⬅ Previous Chapter

</button>

<button
id="nextChapterBtn"
class="writer-btn">

Next Chapter ➡

</button>

</div>

</section>

<section class="comments-section">

<h2>💬 Comments</h2>

<div class="comment-box">

<textarea
id="commentText"
placeholder="Share your thoughts about this chapter..."></textarea>

<div class="comment-footer">

<span class="comment-tip">

💡 Be respectful to other readers.

</span>

<button id="commentBtn">

💬 Post Comment

</button>

</div>

</div>

<div id="commentsList" class="comments-list"></div>
</section>

<div id="footer"></div>

<script src="js/reader.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
