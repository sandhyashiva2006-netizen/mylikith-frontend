<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reader - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="progress-container">
<div id="progressBar"></div>
</div>

<div id="readingProgress" class="reading-progress">

0%

</div>

<section class="reader-container">

<h1 id="chapterTitle">
Loading...
</h1>

<div class="reader-toolbar">

<button id="settingsToggle" class="reader-main-btn">

📖 Reader Settings

</button>

<div class="reader-quick-actions">

<button id="bookmarkBtn">🔖</button>

<button id="translateBtn">🌍</button>

<button id="likeBtn" class="reader-action-btn">

🤍 Like

<span id="likeCount">0</span>

</button>

</div>

</div>

<div id="readerSettings" class="reader-settings">

<!-- MOVE ALL THESE INSIDE -->

A-

A+

Theme

Premium Theme

Font Selector

Listen

Pause

Stop

Speech Rate

Fullscreen

</div>


<div id="chapterLockContainer"></div>

<div id="chapterContent">

Loading...

</div>

<div class="chapter-navigation">

<button
id="prevChapterBtn"
class="start-btn">

⬅ Previous Chapter

</button>

<button
id="nextChapterBtn"
class="writer-btn">

Next Chapter ➡

</button>

</div>

</section>

<section class="comments-section">

<h2>💬 Comments</h2>

<textarea
id="commentText"
placeholder="Share your thoughts...">
</textarea>

<button
id="commentBtn">

Post Comment

</button>

<div id="commentsList">

Loading comments...

</div>

</section>

<div id="footer"></div>

<script src="js/reader.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
