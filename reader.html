<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reader - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="progress-container">
<div id="progressBar"></div>
</div>

<section class="reader-container">

<h1 id="chapterTitle">
Loading...
</h1>

<div class="reader-tools">

<button id="decreaseFont">A-</button>

<button id="increaseFont">A+</button>

<button id="themeBtn">

🌙 Theme

</button>

<button id="premiumThemeBtn">

✨ Premium Theme

</button>

<select id="fontSelector">

<option value="default">

Default

</option>

<option value="serif">

Classic Serif ⭐

</option>

<option value="literata">

Literata ⭐

</option>

<option value="garamond">

Garamond ⭐

</option>

</select>

<button id="readAloudBtn">

🎧 Listen

</button>

<button id="pauseSpeechBtn">

⏸ Pause

</button>

<button id="stopSpeechBtn">

⏹ Stop

</button>

<select id="speechRate">

<option value="0.75">0.75x</option>

<option value="1" selected>1x</option>

<option value="1.25">1.25x</option>

<option value="1.5">1.5x</option>

<option value="2">2x</option>

</select>

<button id="fullscreenBtn">

⛶ Fullscreen

</button>

<button id="bookmarkBtn">

🔖 Bookmark

</button>

<button id="translateBtn">

🌍 Translate

</button>

<button id="likeBtn" class="reader-action-btn">

🤍 Like

<span id="likeCount">

0

</span>

</button>

</div>


<div id="chapterLockContainer"></div>

<div id="chapterContent">

Loading...

</div>

<div class="chapter-navigation">

<button
id="prevChapterBtn"
class="start-btn">

⬅ Previous Chapter

</button>

<button
id="nextChapterBtn"
class="writer-btn">

Next Chapter ➡

</button>

</div>

</section>

<section class="comments-section">

<h2>💬 Comments</h2>

<textarea
id="commentText"
placeholder="Share your thoughts...">
</textarea>

<button
id="commentBtn">

Post Comment

</button>

<div id="commentsList">

Loading comments...

</div>

</section>

<div id="footer"></div>

<script src="js/reader.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
