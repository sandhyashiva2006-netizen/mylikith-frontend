<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Withdraw Earnings | MyLikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/withdraw.css">

</head>

<body>

<nav id="navbar" class="navbar"></nav>

<div class="dashboard">

<div class="withdraw-container">

<h1>💸 Withdraw Earnings</h1>

<p class="page-subtitle">

Withdraw your premium chapter earnings directly to your UPI or Bank Account.

</p>

<!-- Summary -->

<div class="summary-grid">

<div class="summary-card">

<h3>Total Earnings</h3>

<h2 id="totalEarnings">

₹0.00

</h2>

</div>

<div class="summary-card">

<h3>Withdrawable</h3>

<h2 id="withdrawableAmount">

₹0.00

</h2>

</div>

<div class="summary-card">

<h3>Pending</h3>

<h2 id="pendingAmount">

₹0.00

</h2>

</div>

<div class="summary-card">

<h3>Paid</h3>

<h2 id="paidAmount">

₹0.00

</h2>

</div>

</div>

<!-- Payment Details -->

<div class="withdraw-card">

<h2>

💳 Payment Details

</h2>

<div class="form-group">

<label>

Payment Method

</label>

<select id="paymentMethod">

<option value="UPI">

UPI

</option>

<option value="BANK">

Bank Account

</option>

</select>

</div>

<div id="upiSection">

<div class="form-group">

<label>

UPI ID

</label>

<input

type="text"

id="upiId"

placeholder="example@upi">

</div>

</div>

<div id="bankSection">

<div class="form-group">

<label>

Account Holder

</label>

<input

type="text"

id="accountName"

placeholder="Account Holder Name">

</div>

<div class="form-group">

<label>

Bank Name

</label>

<input

type="text"

id="bankName"

placeholder="Bank Name">

</div>

<div class="form-group">

<label>

Account Number

</label>

<input

type="text"

id="accountNumber"

placeholder="Account Number">

</div>

<div class="form-group">

<label>

IFSC Code

</label>

<input

type="text"

id="ifscCode"

placeholder="IFSC Code">

</div>

</div>

<button
id="savePaymentBtn"
class="primary-btn">

💾 Save Payment Details

</button>

</div>

<!-- Withdraw -->

<div class="withdraw-card">

<h2>

💸 Request Withdrawal

</h2>

<div class="form-group">

<label>

Withdraw Amount

</label>

<input

type="number"

id="withdrawAmount"

placeholder="Enter Amount">

<small>

Minimum Withdrawal:
₹500

</small>

</div>

<button

id="withdrawBtn"

class="primary-btn">

Submit Withdrawal Request

</button>

</div>

<!-- History -->

<div class="withdraw-card">

<h2>

📜 Withdrawal History

</h2>

<div id="withdrawHistory">

Loading...

</div>

</div>

</div>

</div>

<div id="footer"></div>

<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/withdraw.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
