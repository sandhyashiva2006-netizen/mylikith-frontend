<style>

.dashboard{

max-width:1400px;

margin:auto;

padding:50px 20px;

}

.dashboard h1{

font-size:42px;

margin-bottom:40px;

}

.section{

margin-bottom:60px;

}

.section h2{

margin-bottom:25px;

font-size:28px;

}

.library-list{

display:grid;

gap:20px;

}

.empty-card{

padding:30px;

background:#111827;

border-radius:15px;

text-align:center;

color:#b8c2cc;

}

.library-card{

display:flex;

justify-content:space-between;

align-items:center;

padding:20px;

background:rgba(17,24,39,.9);

border-radius:15px;

border:1px solid rgba(255,255,255,.08);

transition:.3s;

}

.library-card:hover{

transform:translateY(-4px);

border-color:#7c3aed;

}

.library-card h3{

margin:0 0 8px;

font-size:22px;

}

.library-card p{

margin:0;

color:#cbd5e1;

}

.library-card a{

text-decoration:none;

}

</style>
