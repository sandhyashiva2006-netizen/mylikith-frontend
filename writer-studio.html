<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writer Studio</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/writer-dashboard.css">
<link rel="stylesheet" href="css/writer-studio.css">

</head>

<body>

<nav id="navbar"></nav>

<section class="studio-header">

<div class="studio-info">

<img
id="novelCover"
class="studio-cover"
src="assets/images/default-cover.png">

<div>

<h1 id="novelTitle">
Loading...
</h1>

<p id="novelStatus">
Draft
</p>

</div>

</div>

<div class="studio-actions">

<button
id="saveDraftBtn"
class="novel-btn chapter-btn">

💾 Save

</button>

<button
id="previewBtn"
class="novel-btn">

👁 Preview

</button>

<button
id="publishBtn"
class="novel-btn edit-btn">

🚀 Publish

</button>

<button
id="settingsBtn"
class="novel-btn studio-btn">

⚙ Settings

</button>

</div>

</section>

<section class="studio-layout">

<aside class="chapter-sidebar">

<div class="sidebar-top">

<h2>

📚 Chapters

</h2>

<p id="chapterCount">

0 Chapters

</p>

<button id="newChapterBtn" class="primary-btn">
＋ New Chapter
</button>

</div>

<div
id="chapterList"
class="chapter-list">

<div
id="emptyChapterState"
class="empty-state">

<h3>

No chapters yet

</h3>

<p>

Create your first chapter.

</p>

<button
id="firstChapterBtn"
class="primary-btn">

Create First Chapter

</button>

</div>

</div>

</aside>

<main class="editor-area">

<input
id="chapterTitle"
class="studio-title"
placeholder="Chapter Title">

<div class="editor-toolbar">

<button data-command="bold">
<b>B</b>
</button>

<button data-command="italic">
<i>I</i>
</button>

<button data-command="underline">
<u>U</u>
</button>

<button data-command="insertUnorderedList">

•

List

</button>

<button data-command="insertOrderedList">

1.

List

</button>

<button data-command="justifyLeft">

⬅

</button>

<button data-command="justifyCenter">

⬌

</button>

<button data-command="justifyRight">

➡

</button>

<button
id="undoBtn">

↶

</button>

<button
id="redoBtn">

↷

</button>

</div>

<div
id="chapterEditor"
class="chapter-editor"
contenteditable="true">

Start writing your story...

</div>

<div class="editor-footer">

<div>

<span id="wordCount">
Words : 0
</span>

<span id="charCount">
Characters : 0
</span>

<span id="readingTime">
Reading : 0 min
</span>

</div>

<div>

<span id="saveStatus">
🟢 Saved
</span>

</div>

</div>

</main>

</section>

<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/writer-studio.js"></script>

</body>

</html>
