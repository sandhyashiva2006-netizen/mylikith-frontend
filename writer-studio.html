<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writer Studio</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/writer-dashboard.css">
<link rel="stylesheet" href="css/writer-studio.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GMVCZLKBXV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GMVCZLKBXV');
</script>

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="studio-header">

<div class="studio-info">

<img
id="novelCover"
class="studio-cover"
src="assets/images/default-cover.png">

<div class="studio-meta">

<h1 id="novelTitle">Loading...</h1>

<p id="novelGenre"></p>

<div class="studio-stats">

<span id="novelStatus">Draft</span>

<span id="novelViews">👁 0</span>

<span id="novelFollowers">❤️ 0</span>

</div>

</div>

</div>

<div class="studio-actions">

<button
id="saveDraftBtn"
class="novel-btn chapter-btn">

💾 Save Draft

</button>

<button id="previewBtn" class="novel-btn">
👁 Preview
</button>

<button id="publishBtn" class="novel-btn edit-btn">
🚀 Publish
</button>

<button id="settingsBtn" class="novel-btn studio-btn">
⚙ Settings
</button>

</div>

</section>

<section class="studio-layout">

<aside class="chapter-sidebar">

<div class="sidebar-top">

<h2>

📚 Chapters

</h2>

<p id="chapterCount">

0 Chapters

</p>


</div>

<div
id="chapterList"
class="chapter-list">

<div
id="emptyChapterState"
class="empty-state">

<h3>

No chapters yet

</h3>

<p>

Create your first chapter.

</p>

<button
id="firstChapterBtn"
class="primary-btn">

Create First Chapter

</button>

</div>

</div>

</aside>

<main class="editor-area">

<div class="editor-header">

<h2>

Chapter Editor

</h2>

<button
id="newChapterBtn"
class="chapter-btn">

➕ New Chapter

</button>

</div>

<input
id="chapterTitle"
class="studio-title"
placeholder="Chapter Title">

<div class="premium-options">

<label>

<input
type="checkbox"
id="premiumChapter">

Premium Chapter

</label>

<label>

<input
type="checkbox"
id="earlyAccess">

Premium Early Access

</label>

<input

type="number"

id="chapterCoins"

class="input"

value="20"

min="1"

placeholder="Coins Required"

style="">

<label>

<input
type="checkbox"
id="schedulePublish">

Schedule Publish

</label>

<input
type="datetime-local"
id="publishAt"
class="input"
style="display:none;">

</div>

<div class="editor-toolbar">

<button data-command="bold">
<b>B</b>
</button>

<button data-command="italic">
<i>I</i>
</button>

<button data-command="underline">
<u>U</u>
</button>

<button data-command="insertUnorderedList">

•


</button>

<button data-command="insertOrderedList">

1.


</button>

<button data-command="justifyLeft">

⬅

</button>

<button data-command="justifyCenter">

⬌

</button>

<button data-command="justifyRight">

➡

</button>

<button
id="undoBtn">

↶

</button>

<button
id="redoBtn">

↷

</button>

</div>

<div
id="editorContainer">

<div
id="chapterEditor"
class="chapter-editor"
contenteditable="true">

Start writing your story...

</div>

<div
id="previewContainer"
class="chapter-preview">

</div>

</div>

<div class="editor-footer">

<div>

<span id="wordCount">
Words : 0
</span>

<span id="charCount">
Characters : 0
</span>

<span id="readingTime">
Reading : 0 min
</span>

</div>

<div>

<span id="saveStatus">

🟢 Saved

</span>

<span id="lastSaved">

Never

</span>

</div>

</div>

</main>

<div id="settingsModal" class="modal">

<div class="modal-content settings-modal">

<h2>

Novel Settings

</h2>

<div class="current-novel">

<img
id="settingsCover"
class="settings-cover">

<input
type="file"
id="changeCover"
accept=".jpg,.jpeg,.png,.webp"
class="input">

<button
id="uploadCoverBtn"
class="novel-btn chapter-btn">

📷 Change Cover

</button>

<div>

<h3 id="settingsNovelTitle">

Novel

</h3>

<p id="settingsNovelInfo">

Fantasy • English

</p>

</div>

</div>

<label>Title</label>

<input
id="settingTitle"
class="input">

<label>Description</label>

<textarea
id="settingDescription"
class="input"
rows="5"></textarea>

<label>Category</label>

<select
id="settingCategory"
class="input">

<option>Fantasy</option>
<option>Romance</option>
<option>Mystery</option>
<option>Thriller</option>
<option>Adventure</option>
<option>Historical</option>
<option>Science Fiction</option>
<option>Horror</option>
<option>Comedy</option>
<option>Drama</option>
<option>Action</option>
<option>Young Adult</option>
<option>Children</option>
<option>Poetry</option>
<option>Biography</option>

</select>

<label>Language</label>

<select
id="settingLanguage"
class="input">

<option>English</option>
<option>Telugu</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>Marathi</option>
<option>Bengali</option>
<option>Gujarati</option>
<option>Punjabi</option>
<option>Urdu</option>
<option>Japanese</option>
<option>Korean</option>
<option>Chinese</option>
<option>Spanish</option>
<option>French</option>

</select>

<label>Status</label>

<select
id="settingStatus"
class="input">

<option value="Ongoing">

Ongoing

</option>

<option value="Completed">

Completed

</option>

<option value="Paused">

Paused

</option>

</select>

<div class="modal-actions">

<button
id="closeSettingsBtn"
class="novel-btn delete-btn">

Cancel

</button>

<button
id="saveSettingsBtn"
class="novel-btn chapter-btn">

Save

</button>

</div>

</div>

</div>

<div id="chapterModal" class="modal">

<div class="modal-content">

<h2>Create Chapter</h2>

<input
id="newChapterTitle"
class="input"
placeholder="Chapter Title">

<div class="modal-actions">

<button
id="cancelChapterBtn"
class="novel-btn delete-btn">

Cancel

</button>

<button
id="createChapterBtn"
class="novel-btn chapter-btn">

Create

</button>

</div>

</div>

</div>



</section>

<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/writer-studio.js"></script>

</body>

</html>
