<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Novels</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">

<style>

.container{

max-width:1450px;

margin:auto;

padding:120px 40px 80px;

}

.container h1{

font-size:46px;

margin-bottom:40px;

}

.novels-grid{

display:flex;

flex-direction:column;

gap:24px;

}

.novel-card{

display:grid;

grid-template-columns:180px 1fr;

gap:28px;

background:rgba(18,20,38,.82);

border:1px solid rgba(255,255,255,.08);

border-radius:22px;

padding:22px;

backdrop-filter:blur(18px);

transition:.35s;

box-shadow:0 12px 35px rgba(0,0,0,.30);

}

.novel-card:hover{

transform:translateY(-5px);

border-color:#7C3AED;

box-shadow:0 20px 45px rgba(124,58,237,.20);

}

.novel-card img{

width:180px;

height:260px;

object-fit:cover;

border-radius:16px;

}

.novel-info{

display:flex;

flex-direction:column;

justify-content:space-between;

}

.novel-info h3{

font-size:30px;

margin-bottom:10px;

}

.novel-meta{

display:flex;

flex-wrap:wrap;

gap:18px;

margin:18px 0;

color:#22D3EE;

font-weight:600;

}

.novel-description{

color:#CBD5E1;

line-height:1.8;

margin-bottom:20px;

}

.actions{

display:flex;

flex-wrap:wrap;

gap:12px;

}

.actions button{

padding:12px 22px;

border:none;

border-radius:12px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.edit-btn{

background:#7C3AED;

color:#fff;

}

.edit-btn:hover{

background:#6D28D9;

}

.chapter-btn{

background:#2563EB;

color:#fff;

}

.chapter-btn:hover{

background:#1D4ED8;

}

.analytics-btn{

background:#0891B2;

color:#fff;

}

.analytics-btn:hover{

background:#0E7490;

}

.delete-btn{

background:#DC2626;

color:#fff;

}

.delete-btn:hover{

background:#B91C1C;

}

@media(max-width:900px){

.novel-card{

grid-template-columns:1fr;

}

.novel-card img{

width:220px;

height:320px;

margin:auto;

}

.actions{

justify-content:center;

}

}

</style>

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="container">

<h1>My Novels</h1>

<div id="novelsGrid"
class="novels-grid">

Loading...

</div>

</div>
<div id="footer"></div>

<script src="js/protect.js"></script>
<script src="js/my-novels.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
