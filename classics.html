<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyLikith Classics</title>

    <meta
        name="description"
        content="Read timeless public-domain literature on MyLikith Classics."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/common.css"
    >

    <link
        rel="stylesheet"
        href="css/classics.css"
    >

</head>


<body>


<!-- NAVBAR -->

<nav
    id="navbar"
    class="navbar"
></nav>


<main class="classics-page">


    <!-- HERO -->

    <section class="classics-hero">

        <div class="classics-hero-content">

            <span class="classics-eyebrow">
                MYLIKITH UNIVERSE
            </span>

            <h1>
                MyLikith Classics
            </h1>

            <p>
                Timeless stories and literary works
                preserved for everyone to read.
            </p>

        </div>

    </section>


    <!-- FEATURED -->

    <section class="classics-section">

        <div class="classics-section-heading">

            <div>

                <span>
                    FEATURED
                </span>

                <h2>
                    Timeless Classics
                </h2>

            </div>

        </div>


        <div
            id="featuredClassics"
            class="classics-grid"
        >

            <div class="classics-loading">

                <div class="classics-spinner"></div>

                <p>
                    Loading Classics...
                </p>

            </div>

        </div>

    </section>


    <!-- ALL CLASSICS -->

    <section class="classics-section">

        <div class="classics-section-heading">

            <div>

                <span>
                    LIBRARY
                </span>

                <h2>
                    Explore Classics
                </h2>

            </div>


            <div class="classics-filters">

                <select
                    id="languageFilter"
                >

                    <option value="">
                        All Languages
                    </option>

                </select>

                <select
                    id="categoryFilter"
                >

                    <option value="">
                        All Categories
                    </option>

                </select>

            </div>

        </div>


        <div
            id="classicsGrid"
            class="classics-grid"
        >

            <div class="classics-loading">

                <div class="classics-spinner"></div>

                <p>
                    Loading Classics...
                </p>

            </div>

        </div>

    </section>


</main>


<!-- FOOTER -->

<div id="footer"></div>


<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>
<script src="js/classics.js"></script>


</body>

</html>
