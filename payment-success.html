<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Payment</title>

</head>

<body>

<h2>

Verifying Payment...

</h2>

<script>

const params = new URLSearchParams(window.location.search);

const orderId = params.get("order_id");

if (!orderId) {

    alert("Order ID not found.");

    location.href = "coin-store.html";

}

fetch(

    "https://mylikith-backend.onrender.com/api/wallet/verify-payment",

    {

        method: "POST",

        headers: {

            "Content-Type": "application/json"

        },

        body: JSON.stringify({

            order_id: orderId

        })

    }

)

.then(async (res) => {

    const data = await res.json();

    console.log("VERIFY RESPONSE:", data);

    if (data.success) {

        alert("Payment Successful!");

        location.replace("wallet.html");

    } else {

        alert(data.message || "Payment verification failed.");

        location.replace("coin-store.html");

    }

})

.catch(err => {

    console.error(err);

    alert("Server Error");

    location.replace("coin-store.html");

});

</script>

</body>

</html>
