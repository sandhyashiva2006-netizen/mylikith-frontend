<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Payment</title>

</head>

<body>

<h2>

Verifying Payment...

</h2>

<script>

const params = new URLSearchParams(location.search);

const orderId = params.get("order_id");

const type = params.get("type");

const planId = params.get("plan_id");

const user = JSON.parse(localStorage.getItem("user"));


let url;

let body;

if(type==="premium"){

url="https://mylikith-backend.onrender.com/api/premium/verify-payment";

body={

order_id:orderId,

plan_id:planId,

user_id:user.id

};

}else{

url="https://mylikith-backend.onrender.com/api/wallet/verify-payment";

body={

order_id:orderId

};

}

fetch(

url,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(body)

}

)

.then(async(res)=>{

const data=await res.json();

console.log(data);

if(data.success){

alert("Payment Successful!");

if(type==="premium"){

location.replace("premium.html");

}else{

location.replace("wallet.html");

}

}else{

alert(data.message||"Payment verification failed.");

if(type==="premium"){

location.replace("premium.html");

}else{

location.replace("coin-store.html");

}

}

})

.catch(err=>{

console.log(err);

alert("Server Error");

location.replace("premium.html");

});

</script>

</body>

</html>
