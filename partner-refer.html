<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enter Partner Code | MyLikith</title><style>body{background:#100d1b;color:#f5efff;font:16px Arial}.box{max-width:520px;margin:70px auto;padding:28px;background:#1d172b;border:1px solid #493565;border-radius:16px}input{width:100%;box-sizing:border-box;padding:13px;background:#120e1c;color:white;border:1px solid #54416e;border-radius:9px;margin:10px 0}button{padding:12px 18px;background:#9b68ed;color:white;border:0;border-radius:9px}#msg{color:#d6bdff;line-height:1.6}</style></head><body><main class="box"><h1>Author referral code</h1><p>Enter the Author Growth Partner code shared with you. This request will be reviewed by MyLikith before attribution is approved.</p><form id="f"><input name="partner_code" maxlength="24" placeholder="e.g. MAGPABC123" required><button>Submit code</button></form><p id="msg"></p><p><a href="writer-dashboard.html" style="color:#c5a4ff">Back to writer dashboard</a></p></main><script>const API='https://mylikith-backend.onrender.com';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const token=localStorage.getItem('token');const msg=document.getElementById('msg');if(!token){msg.textContent='Please log in first.';return;}try{const r=await fetch(API+'/api/partners/attribute',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({partner_code:new FormData(e.target).get('partner_code')})});const j=await r.json();msg.textContent=j.message||'Request submitted.';}catch(_){msg.textContent='Network error. Please try again.';}};</script></body></html>
