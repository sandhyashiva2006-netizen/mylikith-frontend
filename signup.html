<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sign Up - Mylikith</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#020b24;
color:white;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:400px;
padding:30px;
background:#08142f;
border-radius:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#7c3aed;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h1>Create Account</h1>

<input id="name" placeholder="Name">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="register()">
Sign Up
</button>

</div>

<script src="js/auth.js"></script>

</body>

</html>
