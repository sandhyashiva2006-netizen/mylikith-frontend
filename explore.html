<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="explore-header">

<h1>Explore Stories</h1>

<p>
Discover novels from around the world.
</p>

</section>

<section class="filters">

<button class="filter active">All</button>
<button class="filter">Romance</button>
<button class="filter">Fantasy</button>
<button class="filter">Adventure</button>
<button class="filter">Mystery</button>
<button class="filter">Horror</button>
<button class="filter">Sci-Fi</button>

</section>

<div class="recent-search-section">

<div style="display:flex;justify-content:space-between;align-items:center;">

<div class="search-header">

<div class="search-title">

<h3>

🕒 Recent Searches

</h3>

<button
id="clearSearchHistory"
class="clear-btn">

Clear

</button>

</div>

</div>

<div id="recentSearches"></div>

</div>

<div class="trending-search-section">

<h3>

🔥 Trending Searches

</h3>

<div id="trendingSearches">

Loading...

</div>

</div>

<section class="search-section">

<input
type="text"
id="searchInput"
placeholder="🔍 Search novels..."
onkeyup="searchNovels()">

</section>

<div id="novelsGrid" class="novels-grid"></div>
<div id="footer"></div>

<script src="js/explore.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
