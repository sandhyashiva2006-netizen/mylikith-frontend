<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3294540255009685"
     crossorigin="anonymous"></script>
  
<title>Explore - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/responsive.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GMVCZLKBXV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-GMVCZLKBXV');
</script>

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="explore-header">

<h1>Explore Stories</h1>

<p>
Discover novels from around the world.
</p>

</section>

<section class="search-section">

<div class="explore-search">

<input
id="searchInput"
type="text"
placeholder="🔍 Search novels, authors, genres..."
onkeyup="searchNovels()">

<button
id="searchBtn"
onclick="searchNovels()">

Search

</button>

</div>

</section>

<div class="mobile-filters">

<select id="mobileGenre">

<option value="All">📚 All Genres</option>
<option>Fantasy</option>
<option>Romance</option>
<option>Mystery</option>
<option>Sci-Fi</option>
<option>Adventure</option>
<option>Horror</option>
<option>Thriller</option>

</select>

<select id="mobileLanguage">

<option value="All">🌍 All Languages</option>
<option>Telugu</option>
<option>English</option>
<option>Hindi</option>
<option>Tamil</option>
<option>Kannada</option>
<option>Malayalam</option>
<option>Marathi</option>
<option>Bengali</option>
<option>Japanese</option>
<option>Korean</option>
<option>Chinese</option>

</select>

</div>

<section class="filters">

<div class="filter-chips">

<button class="chip genre-chip active" data-genre="All">All</button>

<button class="chip genre-chip" data-genre="Fantasy">Fantasy</button>

<button class="chip genre-chip" data-genre="Romance">Romance</button>

<button class="chip genre-chip" data-genre="Mystery">Mystery</button>

<button class="chip genre-chip" data-genre="Sci-Fi">Sci-Fi</button>

<button class="chip genre-chip" data-genre="Adventure">Adventure</button>

<button class="chip genre-chip" data-genre="Horror">Horror</button>

<button class="chip genre-chip" data-genre="Thriller">Thriller</button>

</div>

</section>

<h3 class="filter-heading">
🌍 Languages
</h3>

<div class="language-chips">

<button class="chip language-chip active" data-language="All">
All
</button>

<button class="chip language-chip" data-language="Telugu">
Telugu
</button>

<button class="chip language-chip" data-language="English">
English
</button>

<button class="chip language-chip" data-language="Hindi">
Hindi
</button>

<button class="chip language-chip" data-language="Tamil">
Tamil
</button>

<button class="chip language-chip" data-language="Kannada">
Kannada
</button>

<button class="chip language-chip" data-language="Malayalam">
Malayalam
</button>

<button class="chip language-chip" data-language="Marathi">
Marathi
</button>

<button class="chip language-chip" data-language="Bengali">
Bengali
</button>

<button class="chip language-chip" data-language="Japanese">
Japanese
</button>

<button class="chip language-chip" data-language="Korean">
Korean
</button>

<button class="chip language-chip" data-language="Chinese">
Chinese
</button>

</div>

<div class="recent-search-section">

<div style="display:flex;justify-content:space-between;align-items:center;">

<div class="search-header">

<div class="search-title">

<h3>

🕒 Recent Searches

</h3>

<button
id="clearSearchHistory"
class="clear-btn">

Clear

</button>

</div>

</div>

<div id="recentSearches"></div>

</div>
</div>


<div class="trending-search-section">

<h3>

🔥 Trending Searches

</h3>

<div id="trendingSearches">

Loading...

</div>

</div>



<div class="explore-topbar">

<h2>📚 Trending Novels</h2>

<div class="sort-wrapper">

<label for="sortNovels">

Sort

</label>

<select id="sortNovels">

<option>Trending</option>

<option>Newest</option>

<option>Most Read</option>

<option>Highest Rated</option>

<option>Completed</option>

</select>

</div>

</div>

<div id="novelsGrid" class="novels-grid"></div>
<div id="footer"></div>

<script src="js/explore.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
