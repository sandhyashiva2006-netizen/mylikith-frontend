<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore - Mylikith</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<section class="explore-header">

<h1>Explore Stories</h1>

<p>
Discover novels from around the world.
</p>

</section>

<section class="search-section">

<div class="explore-search">

<input
id="searchInput"
type="text"
placeholder="🔍 Search novels, authors, genres..."
onkeyup="searchNovels()">

<button id="searchBtn">

Search

</button>

</div>

</section>

<section class="filters">

<div class="filter-chips">

<button class="chip active">All</button>

<button class="chip">Fantasy</button>

<button class="chip">Romance</button>

<button class="chip">Mystery</button>

<button class="chip">Sci-Fi</button>

<button class="chip">Adventure</button>

<button class="chip">Horror</button>

<button class="chip">Thriller</button>

</div>

</section>

<div class="recent-search-section">

<div style="display:flex;justify-content:space-between;align-items:center;">

<div class="search-header">

<div class="search-title">

<h3>

🕒 Recent Searches

</h3>

<button
id="clearSearchHistory"
class="clear-btn">

Clear

</button>

</div>

</div>

<div id="recentSearches"></div>

</div>
</div>


<div class="trending-search-section">

<h3>

🔥 Trending Searches

</h3>

<div id="trendingSearches">

Loading...

</div>

</div>



<div class="explore-topbar">

<h2>

Trending Novels

</h2>

<select id="sortNovels">

<option>Trending</option>

<option>Newest</option>

<option>Most Read</option>

<option>Highest Rated</option>

<option>Completed</option>

</select>

</div>

<div id="novelsGrid" class="novels-grid"></div>
<div id="footer"></div>

<script src="js/explore.js"></script>
<script src="js/session.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>
</html>
