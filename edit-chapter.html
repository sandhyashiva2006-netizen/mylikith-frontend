<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/responsive.css">

<style>

body{
background:#0b1020;
color:white;
font-family:Arial;
padding:40px;
}

.container{
max-width:1000px;
margin:auto;
}

.input{
width:100%;
padding:15px;
margin-bottom:20px;
border-radius:10px;
border:none;
font-size:18px;
}

.textarea{
width:100%;
height:500px;
padding:20px;
border-radius:10px;
border:none;
font-size:18px;
}

.save-btn{
margin-top:20px;
padding:15px 30px;
background:#7c3aed;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

</style>

<title>Edit Chapter</title>

<link rel="stylesheet"
href="css/style.css">
</head>

<body>

<nav
id="navbar"
class="navbar">

</nav>

<div class="container">

<h1>Edit Chapter</h1>

<input
id="chapterTitle"
class="input"
placeholder="Chapter Title">

<textarea
id="chapterContent"
class="textarea">
</textarea>

<button
class="save-btn"
onclick="saveChapter()">

Save Chapter

</button>

</div>
<div id="footer"></div>

<script src="js/edit-chapter.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>

</body>

</html>
